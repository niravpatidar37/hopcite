name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.21"
      - name: Install (locked)
        run: uv sync --frozen --python 3.12
      - name: Ruff
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy
      - name: Pytest (no secrets, no services; LLM/stack tests skip)
        run: uv run --frozen pytest -p no:cacheprovider -q -rs

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.21"
      - name: Install (locked)
        run: uv sync --frozen --python 3.12
      - name: pip-audit (locked runtime deps)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/req.txt"
          uv run --frozen pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
      - name: Bandit
        run: uv run --frozen bandit -c pyproject.toml -r src -q
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo -v --redact

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t kg-rag-enterprise:ci .
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress kg-rag-enterprise:ci
