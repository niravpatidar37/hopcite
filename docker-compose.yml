name: p1-kgrag

# Local stack only. Every port is bound to 127.0.0.1. Credentials come from ./.env
# (gitignored; see .env.example). Volumes are named so `docker compose -p p1-kgrag stop` keeps data.
services:
  neo4j:
    image: neo4j:5.26.31-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    container_name: p1-kgrag-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    container_name: p1-kgrag-postgres
    environment:
      POSTGRES_USER: kgrag
      POSTGRES_DB: kgrag
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgrag -d kgrag"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The API's least-privilege runtime role, like Terraform's google_sql_user.app on Cloud SQL.
  # Idempotent: creates kgrag_app (LOGIN) or resets its password from PG_APP_PASSWORD. The migration
  # step below then grants it only what R__grants.sql lists.
  db-roles:
    profiles: ["api"]
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    command: ["psql", "-h", "postgres", "-U", "kgrag", "-d", "kgrag", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/sql/db-roles.sql"]
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      PG_APP_PASSWORD: "${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env}"
    volumes:
      - ./docker/db-roles.sql:/sql/db-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Versioned schema migrations (Postgres + Neo4j), the same step Cloud Run runs as a Job before
  # each deploy. Idempotent: `docker compose -p p1-kgrag --profile api run --rm migrate`.
  # Runs as the owner (kgrag); `migrate up` also reports whether kgrag_app is least-privilege.
  migrate:
    profiles: ["api"]
    build: .
    image: hopcite:local
    command: ["python", "-m", "kgrag.migrate", "up"]
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PG_HOST: postgres
      PG_PORT: "5432"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  # The API in a container, configured like Cloud Run: least-privilege DB user (kgrag_app), rate-limit
  # buckets and the LLM spend ledger in Postgres (shared by every instance), routing log in Postgres.
  # KGRAG_API_KEY (>= 16 chars) must be set in .env: the container binds 0.0.0.0 and refuses to
  # start without a key. Answers use local Ollama on the host (host.docker.internal) unless
  # KGRAG_LLM_MODE=fake (CI smoke only; refused outside KGRAG_ENV=dev/ci/test).
  api:
    profiles: ["api"]
    build: .
    image: hopcite:local
    container_name: p1-kgrag-api
    env_file:
      - .env
    environment: &api_env
      NEO4J_URI: bolt://neo4j:7687
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: kgrag_app
      POSTGRES_PASSWORD: "${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env}"
      KGRAG_HOST: 0.0.0.0
      KGRAG_ENV: "${KGRAG_ENV:-dev}"
      KGRAG_LLM_MODE: "${KGRAG_LLM_MODE:-}"
      KGRAG_ROUTING_LOG: postgres
      KGRAG_RATE_LIMIT_BACKEND: postgres
      KGRAG_SPEND_BACKEND: postgres
    ports:
      - "127.0.0.1:8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A second instance with the operator kill switch ON (smoke test: /ask must answer 503 while the
  # probes stay green). Shares the database, so it also exercises the shared limiter.
  api-killswitch:
    profiles: ["smoke"]
    image: hopcite:local
    container_name: p1-kgrag-api-killswitch
    env_file:
      - .env
    environment:
      <<: *api_env
      KGRAG_KILL_SWITCH: "1"
    ports:
      - "127.0.0.1:8111:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  neo4j_data:
  pg_data:
